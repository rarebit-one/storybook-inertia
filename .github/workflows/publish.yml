name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing"
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check version consistency
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version $PKG_VERSION is consistent"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          # No `cache: "npm"` here, deliberately (zizmor cache-poisoning).
          # This job publishes to npm with OIDC trusted publishing and holds
          # `id-token: write`, so anything restored from the Actions cache
          # ends up inside a signed, published package. The cache is writable
          # from lower-trust contexts on this repo, which makes it a supply
          # -chain path into the artifact. A release-only job runs rarely
          # enough that a cold `npm ci` costs seconds; the caching stays on
          # in ci.yml, where the output is not published.
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10.x, but OIDC Trusted Publishing (token-free publish
      # via the GitHub id-token) requires npm >= 11.5.1. Without this the
      # publish PUT fails with a misleading E404 even though provenance signs.
      # Pin the major rather than tracking `@latest`: npm 12 requires
      # node >= 22.22.2, and `npm@latest` broke luminality-ui's v0.8.0 publish
      # with EBADENGINE the moment npm 12 shipped.
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      # Refuse to publish a stub. See scripts/verify-dts.mjs — sidekick-ui
      # v0.7.0 was tagged with an empty `export { }` and was never publishable.
      - name: Verify type declarations
        run: npm run verify:dts

      - name: Publish (dry run)
        if: inputs.dry-run
        run: npm publish --provenance --access public --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
